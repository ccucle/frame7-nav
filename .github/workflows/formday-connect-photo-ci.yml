name: FORMDAY Connect photo core validation
on:
  pull_request:
    branches: [formday-connect-mobile-read-20261124]
    types: [opened, synchronize, reopened]
    paths:
      - 'formday-connect/**'
      - '.github/workflows/formday-connect-photo-ci.yml'
permissions:
  contents: read
jobs:
  attachment-tests:
    if: github.event.pull_request.head.ref == 'feat/formday-connect-meal-photo-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic photo attachment core tests (no credentials or network calls)
        run: node --test formday-connect/test/meal-photo-attachment.test.mjs
