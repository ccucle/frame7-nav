<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FRAME 7 NAV</title>
<meta name="description" content="FRAME 7 이동 링크 · 차량, 도보, 대중교통">
<meta name="theme-color" content="#FEE500">

<link rel="icon" href="/frame7-nav/favicon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="/frame7-nav/favicon.svg">
<link rel="apple-touch-icon" href="/frame7-nav/favicon.svg">
<link rel="canonical" href="https://ccucle.github.io/frame7-nav/">

<meta property="og:title" content="FRAME 7 NAV">
<meta property="og:description" content="FRAME 7 이동 링크 · 차량, 도보, 대중교통">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ccucle.github.io/frame7-nav/">
<meta property="og:site_name" content="FRAME 7 NAV">
<meta property="og:image" content="https://ccucle.github.io/frame7-nav/favicon.svg">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="FRAME 7 NAV">
<meta name="twitter:description" content="FRAME 7 이동 링크 · 차량, 도보, 대중교통">
<meta name="twitter:image" content="https://ccucle.github.io/frame7-nav/favicon.svg">

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.2/kakao.min.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=12928fb05aeed665559796e06a21bf3b&libraries=services"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color-scheme:light}
body{margin:0;background:#f5f5f7;color:#111;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:560px;margin:24px auto}.card{background:white;border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 8px}.label{color:#777;font-size:13px;margin-top:16px}.value{font-size:16px;margin-top:4px;word-break:keep-all}
.status{margin-top:18px;padding:14px;background:#f7f7f8;border-radius:14px;font-size:14px;line-height:1.5}
button{width:100%;margin-top:16px;padding:16px 14px;border:0;border-radius:15px;background:#fee500;color:#111;font-size:17px;font-weight:800}
button.naver{background:#03c75a;color:#fff}button:disabled{opacity:.45}.small{color:#777;font-size:12px;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<main><div class="card">
<h1>FRAME 7 NAV</h1>
<div class="label">이동수단</div><div class="value" id="modeLabel">확인 중…</div>
<div class="label">목적지</div><div class="value" id="destName">확인 중…</div>
<div class="label">주소</div><div class="value" id="destAddress">확인 중…</div>
<div class="label">목적지 좌표</div><div class="value" id="coords">자동 확인 중…</div>
<div class="status" id="status">목적지 정보를 확인 중…</div>
<button id="navBtn" disabled>출발</button>
<div class="small" id="helper"></div>
</div></main>
<script>
const params=new URLSearchParams(location.search);
const MODE=(params.get('mode')||'vehicle').trim().toLowerCase();
const DEST={name:(params.get('name')||'').trim(),address:(params.get('address')||'').trim(),x:null,y:null};
const APPNAME='https://ccucle.github.io/frame7-nav/';
const modeEl=document.getElementById('modeLabel');
const nameEl=document.getElementById('destName');
const addressEl=document.getElementById('destAddress');
const coordsEl=document.getElementById('coords');
const statusEl=document.getElementById('status');
const navBtn=document.getElementById('navBtn');
const helperEl=document.getElementById('helper');

function modeInfo(){
 if(MODE==='walk') return {label:'도보',button:'네이버지도로 걷기',naver:true,path:'walk'};
 if(MODE==='transit'||MODE==='public') return {label:'대중교통',button:'네이버지도로 출발',naver:true,path:'public'};
 return {label:'차량',button:'카카오내비로 출발',naver:false,path:null};
}
const INFO=modeInfo();
function setStatus(msg){statusEl.textContent=msg}
function fail(msg){setStatus('실패 · '+msg);navBtn.disabled=true}
function renderDestination(){
 modeEl.textContent=INFO.label;
 nameEl.textContent=DEST.name||'목적지 이름 없음';
 addressEl.textContent=DEST.address||'주소 없음';
 navBtn.textContent=INFO.button;
 if(INFO.naver)navBtn.classList.add('naver');
 helperEl.textContent=INFO.naver
  ? '출발 시 현재 위치 권한을 사용해 네이버지도 길찾기를 엽니다.'
  : '출발지는 카카오내비가 실행될 때 기기의 현재 위치를 사용합니다.';
 if(DEST.name){document.title=`${DEST.name} · FRAME 7 NAV`;}
}
function geocodeDestination(){
 if(!DEST.address){fail('주소가 전달되지 않았습니다.');return}
 if(!window.kakao||!kakao.maps||!kakao.maps.services){fail('카카오 지도 SDK 또는 services 라이브러리를 불러오지 못했습니다.');return}
 const geocoder=new kakao.maps.services.Geocoder();
 geocoder.addressSearch(DEST.address,function(result,status){
  if(status!==kakao.maps.services.Status.OK||!result||!result.length){fail('목적지 주소의 좌표를 찾지 못했습니다.');return}
  DEST.x=Number(result[0].x);DEST.y=Number(result[0].y);
  coordsEl.textContent=`경도 ${DEST.x} · 위도 ${DEST.y}`;
  setStatus(INFO.naver?'준비 완료 · 출발 시 현재 위치를 확인합니다.':'준비 완료 · 목적지 좌표를 확인했습니다.');
  navBtn.disabled=false;
 });
}
function openNaverRoute(){
 if(DEST.x==null||DEST.y==null){fail('목적지 좌표가 아직 준비되지 않았습니다.');return}
 if(!navigator.geolocation){fail('현재 위치 기능을 사용할 수 없습니다.');return}
 setStatus('현재 위치를 확인 중…');
 navBtn.disabled=true;
 navigator.geolocation.getCurrentPosition(function(pos){
  const slat=pos.coords.latitude;
  const slng=pos.coords.longitude;
  const q=new URLSearchParams({
   slat:String(slat),slng:String(slng),sname:'현재 위치',
   dlat:String(DEST.y),dlng:String(DEST.x),dname:DEST.name||DEST.address,
   appname:APPNAME
  });
  const url=`nmap://route/${INFO.path}?${q.toString()}`;
  setStatus(`네이버지도 ${INFO.label} 길찾기를 여는 중…`);
  navBtn.disabled=false;
  window.location.href=url;
 },function(err){
  navBtn.disabled=false;
  if(err.code===1)fail('현재 위치 권한이 필요합니다. Safari 설정에서 위치 접근을 허용해 주세요.');
  else if(err.code===2)fail('현재 위치를 확인할 수 없습니다.');
  else fail('현재 위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.');
 },{enableHighAccuracy:true,timeout:10000,maximumAge:15000});
}
function init(){
 renderDestination();
 try{
  if(typeof Kakao==='undefined'){fail('카카오 JavaScript SDK를 불러오지 못했습니다.');return}
  if(!Kakao.isInitialized())Kakao.init('12928fb05aeed665559796e06a21bf3b');
  geocodeDestination();
 }catch(e){fail('초기화 오류: '+e.message)}
}
navBtn.addEventListener('click',function(){
 try{
  if(INFO.naver){openNaverRoute();return}
  if(DEST.x==null||DEST.y==null){fail('목적지 좌표가 아직 준비되지 않았습니다.');return}
  Kakao.Navi.start({name:DEST.name||DEST.address,x:DEST.x,y:DEST.y,coordType:'wgs84'});
 }catch(e){fail('내비 실행 오류: '+e.message)}
});
window.addEventListener('load',init);
</script>
</body>
</html>
